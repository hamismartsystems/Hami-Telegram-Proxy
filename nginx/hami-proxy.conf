# HAMI Telegram Proxy — Nginx config for panel.hamidesigns.shop + landing
# Developed by HAMI SMART SYSTEMS — Pro

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name panel.hamidesigns.shop landing.hamidesigns.shop proxy.hamidesigns.shop;
    return 301 https://$host$request_uri;
}

# Admin Panel + Bot merged — https://panel.hamidesigns.shop
server {
    listen 443 ssl http2;
    server_name panel.hamidesigns.shop;

    ssl_certificate /etc/letsencrypt/live/panel.hamidesigns.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.hamidesigns.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
    }

    # Bot webhook (optional)
    location /bot/ {
        proxy_pass http://127.0.0.1:8082;
    }
}

# Landing Page — https://landing.hamidesigns.shop or https://proxy.hamidesigns.shop/landing
server {
    listen 443 ssl http2;
    server_name landing.hamidesigns.shop;

    ssl_certificate /etc/letsencrypt/live/landing.hamidesigns.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landing.hamidesigns.shop/privkey.pem;

    root /opt/hami-proxy/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        # Cache static
        expires 1h;
        add_header Cache-Control "public";
    }

    # API proxy to dashboard for stats
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }
}

# MTProto proxy — direct TCP, not HTTP — should be gray cloud in Cloudflare
# This server block is just for documentation, real MTProto runs via mtg Docker on 443
# If using Cloudflare Tunnel, this is handled by cloudflared ingress tcp://localhost:443
